server {
    listen 80;
    server_name kutuphane.mehmetakif.edu.tr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kutuphane.mehmetakif.edu.tr;

    ssl_certificate /etc/letsencrypt/live/kutuphane.mehmetakif.edu.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kutuphane.mehmetakif.edu.tr/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header X-Forwarded-Proto https;
    }
}
